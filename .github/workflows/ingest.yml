name: Fofoqueiro — ingestão diária

on:
  schedule:
    - cron: "0 9 * * *"    # 09:00 UTC = 06:00 America/Fortaleza
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: Install deps
        run: npm i rss-parser

      - name: Run ingestion
        run: node scripts/ingest.mjs

      - name: Commit updated data
        run: |
          git config user.name  "fofoqueiro-bot"
          git config user.email "bot@meato.consulting"
          git add data/*.json
          git diff --cached --quiet || git commit -m "chore(data): daily ingest $(date -u +%Y-%m-%d)"
          git push
