name: Fofoqueiro — ingestão diária

# Rodada leve, todo dia às 09h UTC (06h Fortaleza).
# Coleta: notícias, atos legais, movimentações de negócio.
# NÃO roda Trends (rate-limitado) nem concorrência (só semanal).

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run daily ingestion
        run: node scripts/ingest.mjs --mode=daily

      - name: Commit updated data
        run: |
          git config user.name  "fofoqueiro-bot"
          git config user.email "bot@meato.consulting"
          git add data/*.json
          git diff --cached --quiet || git commit -m "chore(data): daily ingest $(date -u +%Y-%m-%d)"
          git push
